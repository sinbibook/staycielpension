<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:,">
    <title>강릉 스테이씨엘 스파 펜션</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/swiper/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/layout-map.css" />
    <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="강릉 스테이씨엘 스파 펜션" />
  <meta property="og:description" content="아름다운 강원도의 푸른 오션뷰와 힐링 스파, 강릉 더씨엘 스파펜션입니다. 커플, 단체 등 소중한 사람과 즐거운 추억을 만들어보세요." />
  <meta property="og:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/07/15/Yf2rptA5zHFy.jpg" />
  <meta property="og:url" content="https://staycielpension.kr" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="강릉 스테이씨엘 스파 펜션" />
  <meta name="twitter:description" content="아름다운 강원도의 푸른 오션뷰와 힐링 스파, 강릉 더씨엘 스파펜션입니다. 커플, 단체 등 소중한 사람과 즐거운 추억을 만들어보세요." />
  <meta name="twitter:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/07/15/Yf2rptA5zHFy.jpg" />
  <meta name="naver-site-verification" content="b34507bbfc0276c02a48986d7cc7acb41ab4e1c4" />
  <meta name="google-site-verification" content="J8D5ZTQISu7EBvTyI4HeLkODDGyj26AHHk1kTUPLza4" />
</head>
  <body>
    <div class="wrapper">
<div class="container">
        <!-- MAPPER: homepage.customFields.pages.layoutMap.sections[0].hero.images[isSelected] -->
        <div class="con0" data-aos="fade-up">
          <div class="swiper-container">
            <div class="swiper-wrapper">
              <div class="swiper-slide">
                <div class="img"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Room Navigation -->
        <div id="snb_wrap">
          <ul data-room-nav-list>
            <li class="active"><a href="layout-map.html">미리보기</a></li>
          </ul>
        </div>

        <div class="con3 pt200">
          <div class="w1440">
            <!-- MAPPER: homepage.customFields.pages.layoutMap.sections[0].hero.title -->
            <!-- MAPPER: homepage.customFields.pages.layoutMap.sections[0].about.images[].description (3개까지, fallback: #이미지설명) -->
            <div class="conTitle" data-aos="fade-up">
              <div class="subTitle"></div>
              <div class="title"></div>
            </div>
            <!-- MAPPER: rooms[].images[0].thumbnail[0].url + name + description (Room Preview Swiper) -->
            <div class="swiper-container" data-aos="fade-up">
              <div class="swiper-wrapper" data-room-list-slides></div>
              <div class="swiperNavi">
                <div class="swiper-button-prev">
                  <img src="images/icon_arrow_left_2.png" alt="" />
                </div>
                <div class="bar"></div>
                <div class="swiper-button-next">
                  <img src="images/icon_arrow_right_2.png" alt="" />
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- MAPPER: homepage.customFields.pages.layoutMap.sections[0].about.images[0].url -->
        <div class="con5 w1440">
          <div class="img" data-aos="fade-up">
            <img alt="" />
          </div>
          <div class="w1440">
            <div class="tx travelFont" data-aos="fade-up">Room Preview</div>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="https://code.jquery.com/jquery-latest.min.js"></script>
  <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/locomotive-scroll@beta/bundled/locomotive-scroll.min.js"></script>
  <script src="js/data-mapper/pages/header-footer-mapper.js"></script>
  <script src="js/data-mapper/core/base-mapper.js"></script>
  <script src="js/data-mapper/pages/layout-map-mapper.js"></script>
  <script src="js/image-helpers.js"></script>
  <script src="js/preview-handler.js"></script>
  <script src="js/header-footer-loader.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pages/layout-map.js"></script>
</html>
